<!-- FLASHCARDS -->
<section id="atividades" class="container mt-5">

    <h2 class="text-center mb-4">
        Flashcards de Estudo
    </h2>

    <p class="text-center lead">
        Clique em "Ouvir pergunta" para escutar a pergunta.
        Depois clique em "Responder por voz" e fale sua resposta.
    </p>

    <div class="row">

        <!-- FLASHCARD 1 -->
        <article class="col-lg-3 col-md-6 mb-4">

                <div class="card-body">

                    <h3>Flashcard 1</h3>

                    <p id="pergunta1">
                        O que é um sensor?
                    </p>

                    <button
                        class="btn btn-primary w-100 mb-2"
                        onclick="ouvirPergunta(1)">
                        🔊 Ouvir pergunta
                    </button>

                    <button
                        class="btn btn-success w-100"
                        onclick="responderPorVoz(1)">
                        🎤 Responder por voz
                    </button>

                    <div
                        id="resultado1"
                        class="mt-3"
                        aria-live="polite">
                    </div>

                </div>
            </div>
        </article>

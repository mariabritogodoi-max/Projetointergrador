<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Integrador - Acessibilidade</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* Estilos Base */
        body {
            transition: background-color 0.3s, color 0.3s;
        }

        /* Barra de Acessibilidade */
        .barra-acessibilidade {
            background-color: #2c3e50;
            padding: 10px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .barra-acessibilidade button {
            margin: 2px 5px;
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            background-color: #ffffff;
            color: #2c3e50;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .barra-acessibilidade button:hover {
            background-color: #e2e8f0;
        }

        /* Modo Alto Contraste */
        body.alto-contraste {
            background-color: #121212 !important;
            color: #ffffff !important;
        }

        body.alto-contraste .navbar {
            background-color: #000000 !important;
            border-bottom: 2px solid #ffff00;
        }

        body.alto-contraste .card {
            background-color: #1e1e1e !important;
            color: #ffffff !important;
            border: 1px solid #ffff00;
        }

        body.alto-contraste .barra-acessibilidade {
            background-color: #000000;
            border-bottom: 2px solid #ffff00;
        }

        body.alto-contraste .barra-acessibilidade button {
            background-color: #ffff00;
            color: #000000;
        }

        footer {
            background-color: #f8f9fa;
            padding: 20px 0;
            margin-top: 40px;
            text-align: center;
        }

        body.alto-contraste footer {
            background-color: #000000;
            color: #ffffff;
            border-top: 1px solid #ffff00;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">

        <a class="navbar-brand fw-bold" href="#">
            ♿ Projeto Integrador
        </a>

            data-bs-toggle="collapse"

            aria-controls="menu"
            aria-expanded="false"
            aria-label="Alternar navegação">

            <span class="navbar-toggler-icon"></span>

        </button>
